name: Frippertripper
options:
  bundleIdPrefix: com.davebokil
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: false
    GENERATE_INFOPLIST_FILE: true
    INFOPLIST_KEY_UILaunchScreen_Generation: true
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
    ENABLE_PREVIEWS: true
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "17"

targets:
  Frippertripper:
    type: application
    platform: iOS
    sources:
      - path: Frippertripper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.davebokil.frippertripper
        PRODUCT_NAME: Frippertripper
        INFOPLIST_KEY_CFBundleDisplayName: "REVE Model 1"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: A8BS37XPJB
      configs:
        Release:
          # Automatic signing insists on also resolving a Development profile (even
          # for Archive), which requires >=1 registered device - this account has
          # none. Distribution profiles have no device requirement, so Release is
          # pinned to the manually-created one instead of fighting Automatic mode.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: "Frippertripper App Store"
    info:
      path: Generated/Frippertripper-Info.plist
      properties:
        UIBackgroundModes: []
        UIRequiresFullScreen: true
    entitlements:
      path: Generated/Frippertripper.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.davebokil.frippertripper
    dependencies:
      - target: FrippertripperAU
        embed: true

  FrippertripperAU:
    type: app-extension
    platform: iOS
    sources:
      - path: FrippertripperAU
      - path: Frippertripper/Audio/Engine
      - path: Frippertripper/ViewModel
      - path: Frippertripper/Views
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.davebokil.frippertripper.auv3
        PRODUCT_NAME: FrippertripperAU
        INFOPLIST_KEY_CFBundleDisplayName: "REVE Model 1 AU"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: A8BS37XPJB
        SKIP_INSTALL: true
      configs:
        Release:
          # Same manual-signing rationale as the Frippertripper target - Automatic
          # would also resolve a Development profile even for Archive. This is a
          # *separate* App ID from the container app, so it needs its own
          # Distribution provisioning profile once the App ID + capability exist in
          # the Developer Portal (see docs/auv3-plan.md's Stage 1 non-code blocker).
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: "Frippertripper AU App Store"
    info:
      path: Generated/FrippertripperAU-Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.AudioUnit-UI
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).AudioUnitViewController
          NSExtensionAttributes:
            AudioComponents:
              - type: aumu
                subtype: Frip
                manufacturer: Dbkl
                name: "Dbkl: REVE Model 1"
                description: "REVE Model 1 - monophonic analog-style synth"
                version: 1
                sandboxSafe: true
                tags:
                  - Synthesizer
    entitlements:
      path: Generated/FrippertripperAU.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.davebokil.frippertripper

  FrippertripperTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FrippertripperTests
    dependencies:
      - target: Frippertripper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.davebokil.frippertripper.tests
        GENERATE_INFOPLIST_FILE: true

schemes:
  Frippertripper:
    build:
      targets:
        Frippertripper: all
        FrippertripperAU: all
        FrippertripperTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FrippertripperTests
    archive:
      config: Release
