name: Frippertripper
options:
  bundleIdPrefix: com.davebokil
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: false
    GENERATE_INFOPLIST_FILE: true
    INFOPLIST_KEY_UILaunchScreen_Generation: true
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
    ENABLE_PREVIEWS: true
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Frippertripper:
    type: application
    platform: iOS
    sources:
      - path: Frippertripper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.davebokil.frippertripper
        PRODUCT_NAME: Frippertripper
        INFOPLIST_KEY_CFBundleDisplayName: Frippertripper
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        CODE_SIGN_STYLE: Automatic
        # DEVELOPMENT_TEAM: <10-char Team ID> - add this once the Apple Developer
        # Program membership clears (Xcode > Settings > Accounts > select the team,
        # or developer.apple.com/account under Membership Details). Since this whole
        # project is regenerated from this file via `xcodegen generate`, setting the
        # team in Xcode's Signing & Capabilities UI instead would get silently wiped
        # out the next time this file's regenerated - it has to live here.
    info:
      path: Generated/Frippertripper-Info.plist
      properties:
        UIBackgroundModes: []
    entitlements:
      path: Generated/Frippertripper.entitlements
      properties: {}

  FrippertripperTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FrippertripperTests
    dependencies:
      - target: Frippertripper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.davebokil.frippertripper.tests
        GENERATE_INFOPLIST_FILE: true

schemes:
  Frippertripper:
    build:
      targets:
        Frippertripper: all
        FrippertripperTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FrippertripperTests
    archive:
      config: Release
