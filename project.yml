name: Frippertripper
options:
  bundleIdPrefix: com.davebokil
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: false
    GENERATE_INFOPLIST_FILE: true
    INFOPLIST_KEY_UILaunchScreen_Generation: true
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
    ENABLE_PREVIEWS: true
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "8"

targets:
  Frippertripper:
    type: application
    platform: iOS
    sources:
      - path: Frippertripper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.davebokil.frippertripper
        PRODUCT_NAME: Frippertripper
        INFOPLIST_KEY_CFBundleDisplayName: Frippertripper
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: A8BS37XPJB
      configs:
        Release:
          # Automatic signing insists on also resolving a Development profile (even
          # for Archive), which requires >=1 registered device - this account has
          # none. Distribution profiles have no device requirement, so Release is
          # pinned to the manually-created one instead of fighting Automatic mode.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: "Frippertripper App Store"
    info:
      path: Generated/Frippertripper-Info.plist
      properties:
        UIBackgroundModes: []
        UIRequiresFullScreen: true
    entitlements:
      path: Generated/Frippertripper.entitlements
      properties: {}

  FrippertripperTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FrippertripperTests
    dependencies:
      - target: Frippertripper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.davebokil.frippertripper.tests
        GENERATE_INFOPLIST_FILE: true

schemes:
  Frippertripper:
    build:
      targets:
        Frippertripper: all
        FrippertripperTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FrippertripperTests
    archive:
      config: Release
